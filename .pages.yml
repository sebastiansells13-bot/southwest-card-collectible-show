media:
  input: src/_includes/img
  output: /img

content:
  - name: events
    label: Shows & Trade Days
    type: collection
    path: src/events
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, kind]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Event Name
        type: string
        required: true
      - name: kind
        label: Type
        type: select
        default: Show
        options:
          values: [Show, Trade Day]
          creatable: true
      - name: date
        label: Date
        type: date
        required: true
        description: The next upcoming event is featured on the home page automatically. Past events move to "Past events".
        options:
          format: yyyy-MM-dd
          time: false
      - name: time
        label: Hours
        type: string
        description: e.g. 10 AM – 5 PM
      - name: venue
        label: Venue
        type: string
        required: true
      - name: address
        label: Address
        type: string
      - name: mapLink
        label: Google Maps Link
        type: string
      - name: tables
        label: Number of Tables
        type: string
        description: Optional, e.g. 145+
      - name: flyer
        label: Flyer
        type: image
        description: The event flyer (the same one you post on Instagram works great).
        options:
          path: posts
      - name: highlights
        label: Highlights
        type: string
        list: true
        description: Short bullet points — giveaways, food, raffles, etc.
      - name: body
        label: Description
        type: rich-text

  - name: posts
    label: News
    type: collection
    path: src/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short Summary
        type: string
        required: true
        description: One sentence, shown in link previews. Max 160 characters.
        options:
          maxlength: 160
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
          time: false
      - name: tags
        label: Category
        type: select
        default: news
        options:
          values: [news, announcement, event]
          creatable: true
      - name: image
        label: Image
        type: image
        description: Shown in the news grid and at the top of the post.
        options:
          path: posts
      - name: body
        label: Body
        type: rich-text

  - name: home
    label: Home Page
    type: file
    path: src/_data/home.json
    fields:
      - name: kicker
        label: Small Text Above Logo
        type: string
      - name: intro
        label: Intro Paragraph
        type: text
      - name: perks
        label: Perks
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: categories
        label: Table Breakdown
        type: object
        list:
          collapsible:
            summary: "{fields.count} {fields.label}"
        fields:
          - { name: label, label: Category, type: string }
          - { name: count, label: Number of Tables, type: string }
      - name: cause
        label: Giving Back Section
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - name: image
            label: Image
            type: image
            options:
              path: posts

  - name: vendors
    label: Vendors Page
    type: file
    path: src/_data/vendors.json
    fields:
      - name: status
        label: Table Status Banner
        type: string
        description: e.g. "Tables are SOLD OUT" or "Tables now available!" Leave blank to hide.
      - name: intro
        label: Intro
        type: text
      - name: map
        label: Vendor Map Image
        type: image
        options:
          path: posts
      - name: mapCaption
        label: Map Caption
        type: string
      - name: faqs
        label: FAQ
        type: object
        list:
          collapsible:
            summary: "{fields.q}"
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }

  - name: sponsors
    label: Sponsors
    type: file
    path: src/_data/sponsors.json
    fields:
      - name: intro
        label: Intro
        type: text
      - name: poweredBy
        label: Presenting Sponsor
        type: string
      - name: list
        label: Sponsors
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - { name: name, label: Business Name, type: string, required: true }
          - name: tier
            label: Level
            type: select
            options:
              values: [Presenting, Sponsor, Giveaway Sponsor]
              creatable: true
          - { name: link, label: Website or Instagram Link, type: string }
          - name: logo
            label: Logo
            type: image
            options:
              path: sponsors
      - name: flyers
        label: Sponsor Flyers
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            options:
              path: posts
          - { name: alt, label: Description, type: string }

  - name: about
    label: About Page
    type: file
    path: src/_data/about.json
    fields:
      - name: body
        label: Our Story
        type: rich-text

  - name: business
    label: Contact & Social Links
    type: file
    path: src/_data/business.json
    fields:
      - { name: name, label: Show Name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: email, label: Email (optional), type: string }
      - { name: phone, label: Phone (optional), type: string }
      - { name: address, label: City / Area, type: string }
      - { name: hashtag, label: Hashtag, type: string }
      - name: social
        label: Social Links
        type: object
        fields:
          - { name: instagram, label: Instagram URL, type: string }
          - { name: instagramHandle, label: Instagram Handle, type: string }
          - { name: discord, label: Discord Invite Link, type: string }
          - { name: facebook, label: Facebook URL, type: string }
