# Fields ending in "(Spanish)" are optional: they're shown when a visitor
# switches the site to ES. Leave one blank and the English shows in both
# languages.
media:
  input: src/_includes/img
  output: /img

content:
  - name: booking
    label: Table Booking (Pick-a-Table)
    type: file
    path: src/_data/booking.json
    fields:
      - name: open
        label: Taking Vendor Requests
        type: boolean
        description: "ON: the Pick-a-Table floor map and request form show on the Vendors page. OFF: they're hidden and vendors see the \"opening soon\" message below instead."
      - name: openStatus
        label: Banner While Open
        type: string
        description: Shown at the top of the Vendors page while requests are on.
      - name: openStatusEs
        label: Banner While Open (Spanish)
        type: string
      - name: closedStatus
        label: Banner While Closed
        type: string
        description: Optional, e.g. "Tables are SOLD OUT". Leave blank for no banner.
      - name: closedStatusEs
        label: Banner While Closed (Spanish)
        type: string
      - name: closedMessage
        label: Message While Closed
        type: text
      - name: closedMessageEs
        label: Message While Closed (Spanish)
        type: text
      - name: showName
        label: Show Name
        type: string
      - name: showNameEs
        label: Show Name (Spanish)
        type: string
      - name: showDate
        label: Show Date
        type: string
        description: e.g. "Saturday, February 6, 2027" or "Date announced soon"
      - name: showDateEs
        label: Show Date (Spanish)
        type: string
        description: e.g. "Sábado 6 de febrero de 2027"
      - name: venue
        label: Venue
        type: string
      - name: intro
        label: Intro Text
        type: text
      - name: introEs
        label: Intro Text (Spanish)
        type: text
      - name: maxTables
        label: Max Tables Per Vendor
        type: number
      - name: pricing
        label: Table Prices
        type: object
        list:
          collapsible:
            summary: "{fields.label} {fields.price}"
        fields:
          - { name: label, label: Table Type, type: string, description: "e.g. 6 ft table, Corner table" }
          - { name: labelEs, label: Table Type (Spanish), type: string, description: "e.g. Mesa de 6 pies" }
          - { name: price, label: Price, type: string, description: "e.g. $75" }
      - name: tables
        label: Reserved Tables
        description: Only list tables that are NOT open. Every table not listed here shows as open on the map. Clear this list to start a new show with a blank map.
        type: object
        list:
          collapsible:
            summary: "Table {fields.number} · {fields.status} · {fields.vendor}"
        fields:
          - { name: number, label: Table Number, type: number, required: true }
          - name: status
            label: Status
            type: select
            default: Taken
            options:
              values: [Taken, Pending, Not available]
          - { name: vendor, label: Vendor Name, type: string, description: "Read out to screen readers on the map. Optional." }
      - name: categories
        label: '"What You Sell" Options'
        type: object
        list:
          collapsible:
            summary: "{fields.label}"
        fields:
          - { name: label, label: Option, type: string, required: true }
          - { name: labelEs, label: Option (Spanish), type: string }
      - name: confirmNote
        label: Confirmation Message
        type: text
      - name: confirmNoteEs
        label: Confirmation Message (Spanish)
        type: text
      - name: formEndpoint
        label: Form Endpoint (developer setting)
        type: string
        description: "Where requests are emailed. Currently FormSubmit sending to tables@swccshows.com (https://formsubmit.co/ajax/tables@swccshows.com). If blank, vendors get a copy-and-DM summary instead."
      - name: paymentLink
        label: Payment Link
        type: string
        description: Optional Stripe/Square payment link shown after a request is sent.
      - name: paymentNote
        label: Payment Link Text
        type: string
      - name: paymentNoteEs
        label: Payment Link Text (Spanish)
        type: string

  - name: events
    label: Shows & Trade Days
    type: collection
    path: src/events
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, kind]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Event Name
        type: string
        required: true
      - name: titleEs
        label: Event Name (Spanish)
        type: string
      - name: kind
        label: Type
        type: select
        default: Show
        options:
          values: [Show, Trade Day]
      - name: date
        label: Date
        type: date
        required: true
        description: The next upcoming event is featured on the home page automatically. Past events move to "Past events".
        options:
          format: yyyy-MM-dd
          time: false
      - name: time
        label: Hours
        type: string
        description: e.g. 10 AM – 5 PM
      - name: venue
        label: Venue
        type: string
        required: true
      - name: address
        label: Address
        type: string
      - name: mapLink
        label: Google Maps Link
        type: string
      - name: tables
        label: Number of Tables
        type: string
        description: Optional, e.g. 145+
      - name: flyer
        label: Flyer
        type: image
        description: The event flyer (the same one you post on Instagram works great).
        options:
          path: posts
      - name: highlights
        label: Highlights
        type: string
        list: true
        description: Short bullet points — giveaways, food, raffles, etc.
      - name: highlightsEs
        label: Highlights (Spanish)
        type: string
        list: true
      - name: body
        label: Description
        type: rich-text
      - name: bodyEs
        label: Description (Spanish)
        type: rich-text
      - name: gallery
        label: Recap Photos
        description: Photos from the show, shown on the show page and (for the most recent past show) on the home page. Portrait photos look best.
        type: object
        list:
          collapsible:
            summary: "{fields.alt}"
        fields:
          - name: image
            label: Photo
            type: image
            options:
              path: recaps
          - { name: alt, label: Description, type: string, description: "What's in the photo, for screen readers, e.g. \"Collectors at the Cardboard Collex booth\"" }
          - { name: altEs, label: Description (Spanish), type: string }
      - name: galleryCredit
        label: Photo Credit
        type: string
        description: e.g. @_gabryella.photography_

  - name: posts
    label: News
    type: collection
    path: src/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: titleEs
        label: Title (Spanish)
        type: string
      - name: description
        label: Short Summary
        type: string
        required: true
        description: One sentence, shown in link previews. Max 160 characters.
        options:
          maxlength: 160
      - name: descriptionEs
        label: Short Summary (Spanish)
        type: string
        options:
          maxlength: 160
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
          time: false
      - name: tags
        label: Category
        type: select
        default: news
        options:
          values: [news, announcement, event]
          creatable: true
      - name: image
        label: Image
        type: image
        description: Shown in the news grid and at the top of the post.
        options:
          path: posts
      - name: body
        label: Body
        type: rich-text
      - name: bodyEs
        label: Body (Spanish)
        type: rich-text
        description: If you edit the English body, please update this too.

  - name: home
    label: Home Page
    type: file
    path: src/_data/home.json
    fields:
      - { name: kicker, label: Small Text Above Logo, type: string }
      - { name: kickerEs, label: Small Text Above Logo (Spanish), type: string }
      - { name: intro, label: Intro Paragraph, type: text }
      - { name: introEs, label: Intro Paragraph (Spanish), type: text }
      - name: perks
        label: Perks
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: title, label: Title, type: string }
          - { name: titleEs, label: Title (Spanish), type: string }
          - { name: text, label: Text, type: text }
          - { name: textEs, label: Text (Spanish), type: text }
      - name: categories
        label: Table Breakdown
        type: object
        list:
          collapsible:
            summary: "{fields.count} {fields.label}"
        fields:
          - { name: label, label: Category, type: string }
          - { name: labelEs, label: Category (Spanish), type: string }
          - { name: count, label: Number of Tables, type: string }
      - name: cause
        label: Giving Back Section
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: titleEs, label: Title (Spanish), type: string }
          - { name: text, label: Text, type: text }
          - { name: textEs, label: Text (Spanish), type: text }
          - name: image
            label: Image
            type: image
            options:
              path: posts

  - name: visit
    label: Plan Your Visit Page
    type: file
    path: src/_data/visit.json
    fields:
      - { name: intro, label: Intro, type: text }
      - { name: introEs, label: Intro (Spanish), type: text }
      - name: bring
        label: What to Bring
        type: object
        list:
          collapsible:
            summary: "{fields.item}"
        fields:
          - { name: item, label: Item, type: string }
          - { name: itemEs, label: Item (Spanish), type: string }
      - name: faqs
        label: Visitor FAQ
        type: object
        list:
          collapsible:
            summary: "{fields.q}"
        fields:
          - { name: q, label: Question, type: string }
          - { name: qEs, label: Question (Spanish), type: string }
          - { name: a, label: Answer, type: text }
          - { name: aEs, label: Answer (Spanish), type: text }

  - name: vendorDirectory
    label: Vendor Directory
    type: file
    path: src/_data/vendorDirectory.json
    fields:
      - { name: intro, label: Intro, type: text }
      - { name: introEs, label: Intro (Spanish), type: text }
      - name: list
        label: Vendors
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - { name: name, label: Shop or Vendor Name, type: string, required: true }
          - name: specialty
            label: Specialty
            type: select
            options:
              values: ["Sports Cards", "Pokémon", "Other TCG", "Comics", "Hot Wheels", "Clothing & Memorabilia", "Toys & Other Collectibles"]
          - { name: instagram, label: Instagram Link, type: string }
          - { name: website, label: Website, type: string }
          - name: logo
            label: Logo
            type: image
            options:
              path: vendors

  - name: vendors
    label: Vendors Page
    type: file
    path: src/_data/vendors.json
    fields:
      - name: intro
        label: Intro
        type: text
      - name: introEs
        label: Intro (Spanish)
        type: text
      - name: map
        label: Last Show's Vendor Map Image
        type: image
        description: Shown below the Pick-a-Table map for reference. Remove it to hide that section.
        options:
          path: posts
      - { name: mapCaption, label: Map Caption, type: string }
      - { name: mapCaptionEs, label: Map Caption (Spanish), type: string }
      - name: faqs
        label: FAQ
        type: object
        list:
          collapsible:
            summary: "{fields.q}"
        fields:
          - { name: q, label: Question, type: string }
          - { name: qEs, label: Question (Spanish), type: string }
          - { name: a, label: Answer, type: text }
          - { name: aEs, label: Answer (Spanish), type: text }

  - name: sponsors
    label: Sponsors
    type: file
    path: src/_data/sponsors.json
    fields:
      - { name: intro, label: Intro, type: text }
      - { name: introEs, label: Intro (Spanish), type: text }
      - { name: poweredBy, label: Presenting Sponsor, type: string }
      - name: list
        label: Sponsors
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - { name: name, label: Business Name, type: string, required: true }
          - name: tier
            label: Level
            type: select
            options:
              values: [Presenting, Sponsor, Giveaway Sponsor]
          - { name: link, label: Website or Instagram Link, type: string }
          - name: logo
            label: Logo
            type: image
            options:
              path: sponsors
      - name: flyers
        label: Sponsor Flyers
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            options:
              path: posts
          - { name: alt, label: Description, type: string }
      - name: packages
        label: Sponsor Packages Page
        type: object
        fields:
          - { name: intro, label: Intro, type: text }
          - { name: introEs, label: Intro (Spanish), type: text }
          - name: stats
            label: Stats
            type: object
            list:
              collapsible:
                summary: "{fields.value} {fields.label}"
            fields:
              - { name: value, label: Number, type: string, description: "e.g. 145+" }
              - { name: valueEs, label: Number (Spanish), type: string, description: "Only if it's a word, e.g. Gratis" }
              - { name: label, label: Label, type: string }
              - { name: labelEs, label: Label (Spanish), type: string }
          - name: tiers
            label: Packages
            type: object
            list:
              collapsible:
                summary: "{fields.name}"
            fields:
              - { name: name, label: Package Name, type: string }
              - { name: nameEs, label: Package Name (Spanish), type: string }
              - { name: price, label: Price, type: string, description: "e.g. $250 or Contact us" }
              - { name: priceEs, label: Price (Spanish), type: string }
              - { name: featured, label: Highlight This Package, type: boolean }
              - { name: perks, label: What's Included, type: string, list: true }
              - { name: perksEs, label: What's Included (Spanish), type: string, list: true }
          - { name: contactNote, label: Contact Text, type: text }
          - { name: contactNoteEs, label: Contact Text (Spanish), type: text }
          - name: formEndpoint
            label: Inquiry Form Endpoint (developer setting)
            type: string
            description: "Where sponsor inquiries are emailed. Currently FormSubmit sending to tables@swccshows.com. If blank, the Table Booking endpoint is used."

  - name: about
    label: About Page
    type: file
    path: src/_data/about.json
    fields:
      - { name: body, label: Our Story, type: rich-text }
      - { name: bodyEs, label: Our Story (Spanish), type: rich-text }

  - name: business
    label: Contact & Social Links
    type: file
    path: src/_data/business.json
    fields:
      - { name: name, label: Show Name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: taglineEs, label: Tagline (Spanish), type: string }
      - { name: email, label: Email (optional), type: string }
      - { name: phone, label: Phone (optional), type: string }
      - { name: address, label: City / Area, type: string }
      - { name: hashtag, label: Hashtag, type: string }
      - name: social
        label: Social Links
        type: object
        fields:
          - { name: instagram, label: Instagram URL, type: string }
          - { name: instagramHandle, label: Instagram Handle, type: string }
          - { name: discord, label: Discord Invite Link, type: string }
          - { name: facebook, label: Facebook URL, type: string }
